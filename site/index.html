<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ric Curves Viewer</title>
<script>
// Applied synchronously, before CSS paints, so a stored "light" preference
// doesn't flash dark first. Main theme-toggle logic lives in the deferred
// script at the bottom; this is just the anti-flash half of it.
(function () {
  try {
    var t = localStorage.getItem("curveViewerTheme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-theme", t);
    }
  } catch (e) { /* localStorage unavailable — fall back to default theme */ }
})();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg-main: #0b0c0e;
    --bg-panel: #17191d;
    --bg-elevated: #202328;
    --border: #2a2d32;
    --ink: #e8e8e6;
    --ink-muted: #9a9a94;
    --accent: #5b9dd9;
    --accent-ink: #ffffff;
    --warn: #d98c3d;
    --shadow: rgba(0, 0, 0, 0.4);
    --series-1: #3987e5;   /* BTC */
    --series-2: #d95926;   /* ETH */
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg-main: #e9eaec;
    --bg-panel: #ffffff;
    --bg-elevated: #f1f2f4;
    --border: #d8dadd;
    --ink: #1d1f23;
    --ink-muted: #6b6e73;
    --accent: #2563a8;
    --accent-ink: #ffffff;
    --warn: #a35b14;
    --shadow: rgba(30, 32, 36, 0.15);
    --series-1: #2a78d6;   /* BTC */
    --series-2: #eb6834;   /* ETH */
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-main);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .layout {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---- top bar ---- */
  .topbar {
    position: relative;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
  }
  .topbar-title {
    font-size: 1.5rem;
    font-weight: 700;
  }
  .kebab-btn {
    background: none;
    border: 1px solid transparent;
    color: var(--ink);
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 8px;
  }
  .kebab-btn:hover, .kebab-btn[aria-expanded="true"] {
    background: var(--bg-elevated);
    border-color: var(--border);
  }
  .menu-panel {
    position: absolute;
    top: 48px;
    right: 12px;
    min-width: 190px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 10px 30px var(--shadow);
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .menu-panel.open { display: flex; }
  .menu-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    padding: 6px 8px 4px;
  }
  .theme-switch {
    display: flex;
    gap: 6px;
    padding: 0 6px 8px;
  }
  .theme-switch button {
    flex: 1;
    padding: 6px 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-main);
    color: var(--ink);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .theme-switch button.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .menu-divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }
  .menu-action {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px;
    border-radius: 6px;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 0.88rem;
    cursor: pointer;
  }
  .menu-action:hover { background: var(--bg-elevated); }

  /* ---- body: sidebar + content ---- */
  .body {
    display: flex;
    flex: 1;
  }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field label {
    display: block;
    font-size: 0.75rem;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  select {
    width: 100%;
    background: var(--bg-main);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%),
                      linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  select:focus { outline: 1px solid var(--accent); }
  #expiry-field { display: none; }

  .content {
    flex: 1;
    background: var(--bg-main);
    padding: 28px 16px;
    display: flex;
    justify-content: center;
  }
  .content-inner {
    width: 100%;
    max-width: 750px;
  }

  .card {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  .asof {
    color: var(--ink-muted);
    font-size: 0.95rem;
    margin: 0 0 14px;
  }
  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 1.02rem;
    white-space: nowrap;
  }
  th, td {
    padding: 10px 14px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--ink-muted);
    font-weight: 600;
    background: var(--bg-elevated);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-elevated); }
  .source {
    color: var(--ink-muted);
    font-size: 0.85rem;
    margin: 14px 0 0;
    line-height: 1.4;
  }
  .freshness {
    color: var(--ink-muted);
    font-size: 0.78rem;
    margin: 10px 0 0;
    line-height: 1.5;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .empty {
    color: var(--ink-muted);
    font-size: 0.95rem;
    padding: 24px 4px;
  }

  /* ---- interpolation tool ---- */
  .interp-box {
    margin-top: 16px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    display: none;
  }
  .interp-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin-bottom: 10px;
  }
  .interp-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .interp-row .field { flex: 1 1 160px; }
  input[type="date"] {
    width: 100%;
    background: var(--bg-main);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 0.92rem;
    font-family: inherit;
  }
  input[type="date"]:focus { outline: 1px solid var(--accent); }
  .interp-result {
    margin-top: 12px;
    font-size: 0.92rem;
    line-height: 1.5;
  }
  .interp-result b { font-weight: 600; }
  .interp-method {
    color: var(--ink-muted);
    font-size: 0.78rem;
    margin-top: 6px;
  }
  .interp-muted { color: var(--ink-muted); }
  .interp-warn { color: var(--warn); }
  /* ---- H-004 PIT section ---- */
  .pit-hero {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pit-n-big {
    font-size: 3.4rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .pit-n-of {
    font-size: 1.1rem;
    color: var(--ink-muted);
  }
  .pit-progress {
    height: 6px;
    border-radius: 3px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    margin: 12px 0 10px;
    overflow: hidden;
  }
  .pit-progress > div {
    height: 100%;
    background: var(--accent);
  }
  .pit-next { font-size: 0.95rem; line-height: 1.5; }
  .pit-section-title {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin: 26px 0 8px;
  }
  .pit-note {
    color: var(--ink-muted);
    font-size: 0.82rem;
    line-height: 1.45;
    margin: 8px 0 0;
  }
  .pit-chart { position: relative; }
  .pit-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .pit-chart text { fill: var(--ink-muted); font-size: 12px; font-family: inherit; }
  .pit-chart .axis { stroke: var(--border); stroke-width: 1; }
  .pit-chart .grid { stroke: var(--border); stroke-width: 1; opacity: 0.6; }
  .pit-chart .ref { stroke: var(--ink-muted); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  .pit-chart .crosshair { stroke: var(--ink-muted); stroke-width: 1; }
  .pit-legend {
    display: flex;
    gap: 16px;
    font-size: 0.85rem;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }
  .pit-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .pit-legend i {
    display: inline-block;
    width: 14px;
    height: 3px;
    border-radius: 2px;
  }
  .pit-legend i.dash {
    height: 0;
    border-top: 2px dashed var(--ink-muted);
  }
  .viz-tip {
    position: absolute;
    pointer-events: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 6px 18px var(--shadow);
    padding: 6px 9px;
    font-size: 0.8rem;
    line-height: 1.45;
    white-space: nowrap;
    display: none;
    z-index: 5;
  }
  .viz-tip strong { font-weight: 600; }
  .viz-tip .muted { color: var(--ink-muted); }
  .flag-yes { color: var(--warn); font-weight: 600; }
  details.pit-table-view { margin-top: 8px; font-size: 0.85rem; color: var(--ink-muted); }
  details.pit-table-view summary { cursor: pointer; }
  details.pit-table-view .table-wrap { margin-top: 8px; }

  footer {
    color: var(--ink-muted);
    font-size: 0.72rem;
    text-align: center;
    padding: 4px 16px 24px;
    line-height: 1.5;
  }

  @media (max-width: 760px) {
    .body { flex-direction: column; }
    .sidebar {
      width: 100%;
      flex-direction: row;
      flex-wrap: wrap;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }
    .sidebar .field { flex: 1 1 140px; }
    .content { padding: 20px 12px; }
    .pit-table { font-size: 0.88rem; }
    .pit-table th, .pit-table td { padding: 8px 8px; }
  }
</style>
</head>
<body>
<div class="layout">
  <header class="topbar">
    <div class="topbar-title">Ric Curves Viewer</div>
    <div style="position: relative;">
      <button id="kebab-btn" class="kebab-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">&#8942;</button>
      <div id="menu-panel" class="menu-panel" role="menu">
        <div class="menu-label">Theme</div>
        <div class="theme-switch">
          <button id="theme-dark-btn" type="button">Dark</button>
          <button id="theme-light-btn" type="button">Light</button>
        </div>
        <div class="menu-divider"></div>
        <button id="refresh-btn" class="menu-action" type="button" role="menuitem">Refresh</button>
      </div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="field">
        <label for="curve-select">View</label>
        <select id="curve-select"></select>
      </div>
      <div class="field" id="date-field">
        <label for="date-select">Date</label>
        <select id="date-select"></select>
      </div>
      <div class="field" id="expiry-field">
        <label for="expiry-select">Expiry</label>
        <select id="expiry-select"></select>
      </div>
    </aside>

    <main class="content">
      <div class="content-inner">
        <div class="card">
          <h2 id="curve-title">—</h2>
          <p class="asof" id="curve-asof"></p>
          <div id="table-slot"></div>

          <div id="interp-box" class="interp-box">
            <div class="interp-title">Interpolate</div>
            <div class="interp-row">
              <div class="field">
                <label for="interp-target">Valuation date</label>
                <input type="date" id="interp-target">
              </div>
              <div class="field">
                <label for="interp-end">Maturity date</label>
                <input type="date" id="interp-end">
              </div>
            </div>
            <div class="interp-result" id="interp-result"></div>
          </div>

          <div class="freshness" id="freshness"></div>
          <p class="source" id="curve-source"></p>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <div>Static mirror of the QuantLibLab dashboard — frozen from golden snapshots and the daily CSV store. No live network calls; "Refresh" re-fetches this page's data file, it does not re-run the harness.</div>
    <div id="generated-at"></div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var THEME_KEY = "curveViewerTheme";
  var data = null;

  var els = {
    curveSelect: document.getElementById("curve-select"),
    dateField: document.getElementById("date-field"),
    dateSelect: document.getElementById("date-select"),
    expiryField: document.getElementById("expiry-field"),
    expirySelect: document.getElementById("expiry-select"),
    title: document.getElementById("curve-title"),
    asof: document.getElementById("curve-asof"),
    tableSlot: document.getElementById("table-slot"),
    source: document.getElementById("curve-source"),
    freshness: document.getElementById("freshness"),
    interpBox: document.getElementById("interp-box"),
    interpTarget: document.getElementById("interp-target"),
    interpEnd: document.getElementById("interp-end"),
    interpResult: document.getElementById("interp-result"),
    generatedAt: document.getElementById("generated-at"),
    kebabBtn: document.getElementById("kebab-btn"),
    menuPanel: document.getElementById("menu-panel"),
    themeDarkBtn: document.getElementById("theme-dark-btn"),
    themeLightBtn: document.getElementById("theme-light-btn"),
    refreshBtn: document.getElementById("refresh-btn"),
  };

  // ------------------------------------------------------------------
  // Theme
  // ------------------------------------------------------------------

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") || "dark";
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    els.themeDarkBtn.classList.toggle("active", theme === "dark");
    els.themeLightBtn.classList.toggle("active", theme === "light");
    try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ }
  }

  els.themeDarkBtn.addEventListener("click", function () { applyTheme("dark"); });
  els.themeLightBtn.addEventListener("click", function () { applyTheme("light"); });

  // ------------------------------------------------------------------
  // Kebab menu
  // ------------------------------------------------------------------

  function openMenu() {
    els.menuPanel.classList.add("open");
    els.kebabBtn.setAttribute("aria-expanded", "true");
  }
  function closeMenu() {
    els.menuPanel.classList.remove("open");
    els.kebabBtn.setAttribute("aria-expanded", "false");
  }
  els.kebabBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    if (els.menuPanel.classList.contains("open")) closeMenu(); else openMenu();
  });
  document.addEventListener("click", function (e) {
    if (!els.menuPanel.contains(e.target) && e.target !== els.kebabBtn) closeMenu();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMenu();
  });

  // ------------------------------------------------------------------
  // Table rendering
  // ------------------------------------------------------------------

  function fmt(v) {
    return typeof v === "number" ? String(v) : v;
  }

  function renderTable(entry) {
    if (!entry) {
      els.tableSlot.innerHTML = '<p class="empty">No data on disk for this curve / date yet.</p>';
      els.asof.textContent = "";
      els.source.textContent = "";
      return;
    }
    els.asof.textContent = "Date: " + entry.asof;
    els.source.textContent = entry.source || "";

    var html = '<div class="table-wrap"><table><thead><tr>';
    entry.columns.forEach(function (c) { html += "<th>" + c + "</th>"; });
    html += "</tr></thead><tbody>";
    entry.rows.forEach(function (row) {
      html += "<tr>";
      row.forEach(function (v) { html += "<td>" + fmt(v) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    els.tableSlot.innerHTML = html;
  }

  // ------------------------------------------------------------------
  // Freshness: when this curve's data was captured, and when its
  // schedule next runs. Curve-level (not per-date) — the underlying
  // pipeline either ran on schedule or it didn't, regardless of which
  // historical date you happen to be browsing.
  // ------------------------------------------------------------------

  function pad2(n) { return String(n).padStart(2, "0"); }

  function fmtUTC(d) {
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()) +
      " " + pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes()) + " UTC";
  }

  function relTime(targetMs, nowMs) {
    var diff = targetMs - nowMs;
    var future = diff >= 0;
    var mins = Math.round(Math.abs(diff) / 60000);
    var out;
    if (mins < 60) out = mins + "m";
    else if (mins < 60 * 24) out = Math.floor(mins / 60) + "h " + (mins % 60) + "m";
    else out = Math.floor(mins / 1440) + "d " + Math.floor((mins % 1440) / 60) + "h";
    return future ? "in " + out : out + " ago";
  }

  function nextOccurrence(schedule, now) {
    var d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
                              schedule.hour_utc, schedule.minute_utc, 0, 0));
    if (d <= now) d.setUTCDate(d.getUTCDate() + 1);
    if (schedule.weekdays_only) {
      while (d.getUTCDay() === 0 || d.getUTCDay() === 6) d.setUTCDate(d.getUTCDate() + 1);
    }
    return d;
  }

  function renderFreshness(curveMeta) {
    var now = new Date();
    var lines = [];
    if (curveMeta.latest_captured_at) {
      var captured = new Date(curveMeta.latest_captured_at);
      lines.push("Captured " + fmtUTC(captured) + " (" + relTime(captured.getTime(), now.getTime()) + ")");
    } else {
      lines.push("Not captured yet");
    }
    var schedule = data.schedules[curveMeta.schedule];
    if (schedule) {
      var next = nextOccurrence(schedule, now);
      lines.push("Next refresh " + fmtUTC(next) + " (" + relTime(next.getTime(), now.getTime()) +
        ") — " + schedule.label);
    }
    els.freshness.innerHTML = lines.map(function (l) { return "<div>" + l + "</div>"; }).join("");
  }

  // ------------------------------------------------------------------
  // Interpolation tool (curves with a calendar-date maturity axis only)
  //
  //   vol     : linear in total variance w = sigma^2 * T, then
  //             sigma = sqrt(w / T) -- never interpolate sigma directly,
  //             that breaks calendar-arbitrage consistency (H-004).
  //   rate    : log-linear on discount factors: ln(DF) = -r*T interpolated
  //             linearly in T, then r = -ln(DF)/T.
  //   futures : linear in ln(F), since carry compounds.
  //
  // T is the year fraction from the chosen valuation date to the chosen
  // maturity date (actual/365, matching T_years elsewhere in this repo).
  // Refuses to extrapolate past the quoted range on either method.
  // ------------------------------------------------------------------

  function todayUTCString() {
    var d = new Date();
    return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
  }

  function yearFrac(fromStr, toStr) {
    var a = Date.parse(fromStr + "T00:00:00Z");
    var b = Date.parse(toStr + "T00:00:00Z");
    return (b - a) / (365.0 * 86400000);
  }

  function methodLabel(kind) {
    if (kind === "vol") return "linear in total variance (w = σ²T)";
    if (kind === "rate") return "log-linear on discount factors";
    if (kind === "futures") return "linear in ln(F)";
    return "";
  }

  function linterp(points, tQuery) {
    for (var i = 0; i < points.length - 1; i++) {
      var lo = points[i], hi = points[i + 1];
      if (tQuery >= lo.T && tQuery <= hi.T) {
        if (hi.T === lo.T) return lo.v;
        return lo.v + (hi.v - lo.v) * (tQuery - lo.T) / (hi.T - lo.T);
      }
    }
    return null;
  }

  function transform(kind, raw, T) {
    if (kind === "vol") { var s = raw / 100; return s * s * T; }
    if (kind === "rate") { return -(raw / 100) * T; }
    return Math.log(raw);  // futures
  }

  function backTransform(kind, v, T) {
    if (kind === "vol") return Math.sqrt(Math.max(v, 0) / T) * 100;
    if (kind === "rate") return (-v / T) * 100;
    return Math.exp(v);    // futures
  }

  function fmtValue(kind, v) {
    return kind === "futures" ? v.toFixed(2) : v.toFixed(4);
  }

  // Interpolates one value column (by index) of a table entry. Returns
  // {ok:true, value, T} or {ok:false, reason}.
  function interpolateColumn(entry, valueColIdx, kind, targetDate, endDate) {
    var tQuery = yearFrac(targetDate, endDate);
    if (tQuery <= 0) {
      return { ok: false, reason: "valuation date must be before the maturity date" };
    }
    var matMin = entry.rows[0][0], matMax = entry.rows[entry.rows.length - 1][0];
    if (endDate < matMin || endDate > matMax) {
      return { ok: false, reason: "outside the quoted range (" + matMin + " to " + matMax + ")" };
    }
    var points = entry.rows.map(function (row) {
      var T = yearFrac(targetDate, row[0]);
      return { T: T, v: transform(kind, row[valueColIdx], T) };
    });
    var vInterp = linterp(points, tQuery);
    if (vInterp === null) {
      return { ok: false, reason: "outside the quoted range (" + matMin + " to " + matMax + ")" };
    }
    return { ok: true, value: backTransform(kind, vInterp, tQuery), T: tQuery };
  }

  // Drives interpolateColumn() for either a single-column curve (futures,
  // rate, plain ATM vol term structure) or the multi-column vol-surface-
  // by-delta curve, where every sigma column is interpolated independently
  // and RR25/BF25 are re-derived from the results (same formula the
  // builder uses: rr25 = 25dC-25dP, bf25 = 0.5*(25dC+25dP)-ATM).
  function computeInterpolation(curveMeta, entry, targetDate, endDate) {
    var kind = curveMeta.interp_kind;
    if (!kind || !entry || !entry.rows.length || !targetDate || !endDate) return null;

    if (kind !== "vol" || entry.columns.indexOf("RR25") === -1) {
      var idx = 1;
      var r = interpolateColumn(entry, idx, kind, targetDate, endDate);
      if (!r.ok) return { ok: false, reason: r.reason };
      var lines = [[entry.columns[idx], fmtValue(kind, r.value)]];
      return { ok: true, method: methodLabel(kind), lines: lines, T: r.T };
    }

    var sigmaCols = ["10dP", "25dP", "ATM", "25dC", "10dC"];
    var sigmas = {}, firstErr = null, T = null;
    sigmaCols.forEach(function (col) {
      var r = interpolateColumn(entry, entry.columns.indexOf(col), "vol", targetDate, endDate);
      if (!r.ok) { firstErr = firstErr || r.reason; return; }
      sigmas[col] = r.value;
      T = r.T;
    });
    if (firstErr) return { ok: false, reason: firstErr };
    var rr25 = sigmas["25dC"] - sigmas["25dP"];
    var bf25 = 0.5 * (sigmas["25dC"] + sigmas["25dP"]) - sigmas["ATM"];
    var out = sigmaCols.map(function (c) { return [c, fmtValue("vol", sigmas[c])]; });
    out.push(["RR25", fmtValue("vol", rr25)], ["BF25", fmtValue("vol", bf25)]);
    return { ok: true, method: methodLabel(kind), lines: out, T: T };
  }

  function currentEntryForInterp() {
    var dateEntry = currentCurveDates()[els.dateSelect.value];
    return (dateEntry && !dateEntry.expiries) ? dateEntry : null;
  }

  function renderInterpolation(curveMeta, entry) {
    if (!curveMeta.interp_kind || !entry) {
      els.interpBox.style.display = "none";
      return;
    }
    els.interpBox.style.display = "block";
    els.interpEnd.min = entry.rows[0][0];
    els.interpEnd.max = entry.rows[entry.rows.length - 1][0];

    var target = els.interpTarget.value;
    var end = els.interpEnd.value;
    if (!end) {
      els.interpResult.innerHTML = '<span class="interp-muted">Pick a maturity date.</span>';
      return;
    }
    var r = computeInterpolation(curveMeta, entry, target, end);
    if (!r || !r.ok) {
      els.interpResult.innerHTML = '<span class="interp-warn">' + (r ? r.reason : "no data") + "</span>";
      return;
    }
    var html = r.lines.map(function (pair) {
      return "<div><b>" + pair[0] + ":</b> " + pair[1] + "</div>";
    }).join("");
    html += '<div class="interp-method">Method: ' + r.method + " — T=" + r.T.toFixed(4) + "y</div>";
    els.interpResult.innerHTML = html;
  }

  els.interpTarget.addEventListener("change", function () {
    renderInterpolation(currentCurveMeta(), currentEntryForInterp());
  });
  els.interpEnd.addEventListener("change", function () {
    renderInterpolation(currentCurveMeta(), currentEntryForInterp());
  });

  // ------------------------------------------------------------------
  // H-004 PIT calibration section (data.pit, built by dashboard/pit.py).
  // Public fields only: per expiry {expiry, asset, T, u, calendar_arb},
  // plus qualification aggregates from the harness exclusion log.
  // ------------------------------------------------------------------

  var PIT_KEY = "__pit__";
  var PIT_LABEL = "H-004 PIT calibration";
  var SVG_NS = "http://www.w3.org/2000/svg";
  var ASSET_SERIES = { BTC: "var(--series-1)", ETH: "var(--series-2)" };

  function isPit() { return els.curveSelect.value === PIT_KEY; }

  function esc(v) {
    return String(v).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function svgEl(tag, attrs, parent) {
    var el = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(el);
    return el;
  }

  function svgText(parent, x, y, text, anchor) {
    var t = svgEl("text", { x: x, y: y, "text-anchor": anchor || "start" }, parent);
    t.textContent = text;
    return t;
  }

  // Bar with 4px rounded top, square at the baseline.
  function barPath(x, y, w, h) {
    var r = Math.min(4, w / 2, h);
    return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
      "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
  }

  // One tooltip per chart wrapper; lines are [strongText, mutedText] pairs.
  function showTip(tip, wrap, evt, lines) {
    tip.textContent = "";
    lines.forEach(function (pair) {
      var row = document.createElement("div");
      var b = document.createElement("strong");
      b.textContent = pair[0];
      row.appendChild(b);
      if (pair[1]) {
        var m = document.createElement("span");
        m.className = "muted";
        m.textContent = " " + pair[1];
        row.appendChild(m);
      }
      tip.appendChild(row);
    });
    tip.style.display = "block";
    var box = wrap.getBoundingClientRect();
    var x = evt.clientX - box.left + 12, y = evt.clientY - box.top + 12;
    if (x + tip.offsetWidth > box.width) x = evt.clientX - box.left - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, x) + "px";
    tip.style.top = y + "px";
  }

  // Draw at the container's pixel width (capped) so SVG text stays 12px.
  function chartWidth(wrap) {
    return Math.max(300, Math.min(640, wrap.clientWidth || 640));
  }

  function niceMax(v) {
    if (v <= 5) return Math.max(1, Math.ceil(v));
    var step = Math.pow(10, Math.floor(Math.log10(v)));
    return Math.ceil(v / step) * step;
  }

  function yTicks(max) {
    var step = max <= 6 ? 1 : max / 5;
    var out = [];
    for (var v = 0; v <= max + 1e-9; v += step) out.push(v);
    return out;
  }

  function pitHistogram(wrap, us) {
    var W = chartWidth(wrap), H = 240, L = 40, R = 14, T = 14, B = 40;
    var bins = 10, counts = [];
    for (var i = 0; i < bins; i++) counts.push(0);
    us.forEach(function (u) { counts[Math.min(bins - 1, Math.floor(u * bins))] += 1; });
    var expected = us.length / bins;
    var ymax = niceMax(Math.max(Math.max.apply(null, counts), expected) * 1.15);
    var pw = W - L - R, ph = H - T - B, bw = pw / bins;
    var sy = function (v) { return T + ph - (v / ymax) * ph; };

    var legend = document.createElement("div");
    legend.className = "pit-legend";
    legend.innerHTML = '<span><i style="background: var(--series-1)"></i>settled expiries per bin</span>' +
      '<span><i class="dash"></i>uniform reference (' + expected.toFixed(2) + " per bin)</span>";
    wrap.appendChild(legend);

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "PIT histogram of u with uniform reference" }, wrap);
    yTicks(ymax).forEach(function (v) {
      svgEl("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), "class": v === 0 ? "axis" : "grid" }, svg);
      svgText(svg, L - 8, sy(v) + 4, String(Math.round(v * 100) / 100), "end");
    });
    for (var k = 0; k <= 5; k++) {
      svgText(svg, L + (k / 5) * pw, H - B + 18, (k / 5).toFixed(1), "middle");
    }
    svgText(svg, L + pw / 2, H - 4, "u = F(S*)", "middle");

    var tip = document.createElement("div");
    tip.className = "viz-tip";
    wrap.appendChild(tip);
    counts.forEach(function (c, i) {
      var x = L + i * bw + 1, w = bw - 2;
      if (c > 0) {
        svgEl("path", { d: barPath(x, sy(c), w, sy(0) - sy(c)), fill: "var(--series-1)" }, svg);
      }
      var hit = svgEl("rect", { x: L + i * bw, y: T, width: bw, height: ph, fill: "transparent" }, svg);
      var lo = (i / bins).toFixed(1), hi = ((i + 1) / bins).toFixed(1);
      hit.addEventListener("pointermove", function (e) {
        showTip(tip, wrap, e, [[String(c) + (c === 1 ? " expiry" : " expiries"), "u in [" + lo + ", " + hi + ")"],
                               [expected.toFixed(2), "expected under uniform"]]);
      });
      hit.addEventListener("pointerleave", function () { tip.style.display = "none"; });
    });

    // Uniform(0,1) reference: n/bins expiries per bin. Drawn over the bars.
    svgEl("line", { x1: L, x2: W - R, y1: sy(expected), y2: sy(expected), "class": "ref",
      "pointer-events": "none" }, svg);
  }

  function dayOffset(startStr, dayStr) {
    return Math.round((Date.parse(dayStr + "T00:00:00Z") - Date.parse(startStr + "T00:00:00Z")) / 86400000);
  }

  function pitTrend(wrap, q) {
    var tr = q.n_two_sided, assets = Object.keys(tr.series);
    var W = chartWidth(wrap), H = 230, L = 40, R = 44, T = 14, B = 34;
    var nDays = q.window.days, pw = W - L - R, ph = H - T - B;
    var all = [tr.threshold];
    assets.forEach(function (a) { tr.series[a].forEach(function (v) { if (v !== null) all.push(v); }); });
    var ymax = niceMax(Math.max.apply(null, all) * 1.1);
    var sx = function (i) { return L + (i / (nDays - 1)) * pw; };
    var sy = function (v) { return T + ph - (v / ymax) * ph; };

    // value[asset][dayIndex] over the full window; null where no poll that day
    var byIdx = {};
    assets.forEach(function (a) {
      byIdx[a] = [];
      for (var i = 0; i < nDays; i++) byIdx[a].push(null);
      tr.days.forEach(function (d, j) {
        var i = dayOffset(q.window.start, d);
        if (i >= 0 && i < nDays) byIdx[a][i] = tr.series[a][j];
      });
    });
    var dayLabel = function (i) {
      var d = new Date(Date.parse(q.window.start + "T00:00:00Z") + i * 86400000);
      return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
    };

    var legend = document.createElement("div");
    legend.className = "pit-legend";
    assets.forEach(function (a) {
      var s = document.createElement("span");
      var sw = document.createElement("i");
      sw.style.background = ASSET_SERIES[a] || "var(--ink-muted)";
      s.appendChild(sw);
      s.appendChild(document.createTextNode(a));
      legend.appendChild(s);
    });
    var ls = document.createElement("span");
    var lsw = document.createElement("i");
    lsw.className = "dash";
    ls.appendChild(lsw);
    ls.appendChild(document.createTextNode("qualifying threshold (" + tr.threshold + ")"));
    legend.appendChild(ls);
    wrap.appendChild(legend);

    var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
      "aria-label": "Best ladder n_two_sided per day by asset" }, wrap);
    yTicks(ymax).forEach(function (v) {
      svgEl("line", { x1: L, x2: W - R, y1: sy(v), y2: sy(v), "class": v === 0 ? "axis" : "grid" }, svg);
      svgText(svg, L - 8, sy(v) + 4, String(Math.round(v)), "end");
    });
    [0, Math.floor((nDays - 1) / 2), nDays - 1].forEach(function (i) {
      svgText(svg, sx(i), H - B + 18, dayLabel(i).slice(5), i === 0 ? "start" : i === nDays - 1 ? "end" : "middle");
    });
    svgEl("line", { x1: L, x2: W - R, y1: sy(tr.threshold), y2: sy(tr.threshold), "class": "ref" }, svg);

    assets.forEach(function (a) {
      var color = ASSET_SERIES[a] || "var(--ink-muted)";
      var d = "", pen = false, last = null;
      byIdx[a].forEach(function (v, i) {
        if (v === null) { pen = false; return; }
        d += (pen ? "L" : "M") + sx(i) + "," + sy(v);
        pen = true;
        last = i;
      });
      if (d) svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
      byIdx[a].forEach(function (v, i) {
        if (v !== null) svgEl("circle", { cx: sx(i), cy: sy(v), r: 4, fill: color,
          stroke: "var(--bg-panel)", "stroke-width": 2 }, svg);
      });
      if (last !== null) svgText(svg, sx(last) + 8, sy(byIdx[a][last]) + 4, a);
    });

    var cross = svgEl("line", { x1: 0, x2: 0, y1: T, y2: T + ph, "class": "crosshair",
      visibility: "hidden" }, svg);
    var tip = document.createElement("div");
    tip.className = "viz-tip";
    wrap.appendChild(tip);
    var hit = svgEl("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", function (e) {
      var box = svg.getBoundingClientRect();
      var vx = (e.clientX - box.left) * (W / box.width);
      var i = Math.max(0, Math.min(nDays - 1, Math.round((vx - L) / pw * (nDays - 1))));
      cross.setAttribute("x1", sx(i));
      cross.setAttribute("x2", sx(i));
      cross.setAttribute("visibility", "visible");
      var lines = [[dayLabel(i), ""]];
      assets.forEach(function (a) {
        var v = byIdx[a][i];
        lines.push([v === null ? "—" : String(v), a + (v === null ? " (no poll)" : "")]);
      });
      lines.push([String(tr.threshold), "threshold"]);
      showTip(tip, wrap, e, lines);
    });
    hit.addEventListener("pointerleave", function () {
      tip.style.display = "none";
      cross.setAttribute("visibility", "hidden");
    });

    // Table view of the same series
    var rows = "";
    for (var i = 0; i < nDays; i++) {
      if (assets.every(function (a) { return byIdx[a][i] === null; })) continue;
      rows += "<tr><td>" + esc(dayLabel(i)) + "</td>" + assets.map(function (a) {
        return "<td>" + (byIdx[a][i] === null ? "—" : esc(byIdx[a][i])) + "</td>";
      }).join("") + "</tr>";
    }
    var det = document.createElement("details");
    det.className = "pit-table-view";
    det.innerHTML = "<summary>Show as table</summary><div class=\"table-wrap\"><table><thead><tr><th>Day</th>" +
      assets.map(function (a) { return "<th>" + esc(a) + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    wrap.appendChild(det);
  }

  function pitNextSettlement(pit, now) {
    var pending = pit.observations.filter(function (o) { return o.u === null; })
      .sort(function (a, b) { return a.expiry < b.expiry ? -1 : 1; });
    var future = pending.filter(function (o) { return Date.parse(o.expiry) > now.getTime(); });
    var overdue = pending.filter(function (o) { return Date.parse(o.expiry) <= now.getTime(); });
    var html;
    if (future.length) {
      var t = Date.parse(future[0].expiry);
      var assets = future.filter(function (o) { return o.expiry === future[0].expiry; })
        .map(function (o) { return o.asset; }).join(", ");
      html = "Next expected settlement: <b>" + esc(fmtUTC(new Date(t))) + "</b> (" +
        esc(relTime(t, now.getTime())) + ") — " + esc(assets);
    } else {
      html = "No PIT expiry pending — the next one is added when a ladder first qualifies.";
    }
    if (overdue.length) {
      html += '<div class="pit-note">Expired, awaiting settlement fetch: ' +
        overdue.map(function (o) { return esc(o.asset + " " + fmtUTC(new Date(o.expiry))); }).join("; ") +
        "</div>";
    }
    return html;
  }

  function renderPit() {
    var pit = data.pit;
    els.title.textContent = PIT_LABEL;
    els.dateField.style.display = "none";
    els.expiryField.style.display = "none";
    els.interpBox.style.display = "none";
    renderFreshness(pit);
    els.asof.textContent = "Probability integral transform of Kalshi settlements under the Deribit-implied CDF.";
    els.source.textContent = pit.source;

    var now = new Date();
    var pct = Math.min(100, (pit.n / pit.target_n) * 100);
    var html =
      '<div class="pit-hero"><span class="pit-n-big">' + esc(pit.n) + "</span>" +
      '<span class="pit-n-of">of ' + esc(pit.target_n) + " observations</span></div>" +
      '<div class="pit-progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + esc(pit.target_n) +
      '" aria-valuenow="' + esc(pit.n) + '"><div style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="pit-next">' + pitNextSettlement(pit, now) + "</div>";

    html += '<div class="pit-section-title">PIT histogram</div><div class="pit-chart" id="pit-hist"></div>';
    if (pit.n < 10) {
      html += '<p class="pit-note">With n = ' + esc(pit.n) + ", the histogram cannot distinguish a calibrated " +
        "model from a miscalibrated one; read it as a log of where settlements landed.</p>";
    }

    html += '<div class="pit-section-title">Expiries</div><div class="table-wrap"><table class="pit-table"><thead><tr>' +
      "<th>Expiry (UTC)</th><th>Asset</th><th>T (yrs)</th><th>u</th><th>Calendar arb</th>" +
      "</tr></thead><tbody>";
    pit.observations.slice().reverse().forEach(function (o) {
      html += "<tr><td>" + esc(fmtUTC(new Date(o.expiry)).replace(" UTC", "")) + "</td>" +
        "<td>" + esc(o.asset) + "</td><td>" + esc(o.T.toFixed(4)) + "</td>" +
        "<td>" + (o.u === null ? '<span class="interp-muted">pending</span>' : esc(o.u.toFixed(4))) + "</td>" +
        "<td>" + (o.calendar_arb ? '<span class="flag-yes">yes</span>' : "no") + "</td></tr>";
    });
    html += "</tbody></table></div>";

    var q = pit.qualification;
    html += '<div class="pit-section-title">Qualification, last ' + esc(q.window.days) + " days (" +
      esc(q.window.start) + " to " + esc(q.window.end) + ')</div><div class="table-wrap"><table class="pit-table"><thead><tr>' +
      "<th>Asset</th><th>Events polled</th><th>Qualified</th><th>Rate</th></tr></thead><tbody>";
    Object.keys(q.by_asset).forEach(function (a) {
      var r = q.by_asset[a];
      html += "<tr><td>" + esc(a) + "</td><td>" + esc(r.polled) + "</td><td>" + esc(r.qualified) +
        "</td><td>" + esc((r.rate * 100).toFixed(1)) + "%</td></tr>";
    });
    html += "</tbody></table></div>" +
      '<p class="pit-note">Distinct events that qualified at least once, out of distinct events polled. ' +
      "Most polled events are hourly ladders, which never sit between two usable Deribit expiries.</p>";

    html += '<div class="pit-section-title">n_two_sided — best ladder per day</div>' +
      '<div class="pit-chart" id="pit-trend"></div>' +
      '<p class="pit-note">Highest count of two-sided strikes on any polled ladder that day. ' +
      "A ladder needs " + esc(q.n_two_sided.threshold) + " to qualify. Gaps are days with no harness run.</p>";

    els.tableSlot.innerHTML = html;
    var us = pit.observations.filter(function (o) { return o.u !== null; })
      .map(function (o) { return o.u; });
    var histWrap = document.getElementById("pit-hist");
    if (us.length) pitHistogram(histWrap, us);
    else histWrap.innerHTML = '<p class="empty">No settled PIT expiries yet.</p>';
    if (q.n_two_sided.days.length) pitTrend(document.getElementById("pit-trend"), q);
    else document.getElementById("pit-trend").innerHTML = '<p class="empty">No polls in this window.</p>';
  }

  // ------------------------------------------------------------------
  // Dropdown cascade: curve -> date -> (expiry, smile curves only)
  // ------------------------------------------------------------------

  function currentCurveMeta() {
    return data.curves[els.curveSelect.value] || {};
  }
  function currentCurveDates() {
    return currentCurveMeta().dates || {};
  }

  function onExpiryChange() {
    var dateEntry = currentCurveDates()[els.dateSelect.value];
    if (!dateEntry) { renderTable(null); return; }
    renderTable(dateEntry.by_expiry[els.expirySelect.value]);
    renderInterpolation(currentCurveMeta(), null);  // smile curves have no maturity axis
  }

  function onDateChange() {
    var dateEntry = currentCurveDates()[els.dateSelect.value];
    if (dateEntry && dateEntry.expiries) {
      els.expiryField.style.display = "block";
      var keepExpiry = els.expirySelect.value;
      els.expirySelect.innerHTML = "";
      dateEntry.expiries.forEach(function (ex) {
        var opt = document.createElement("option");
        opt.value = ex;
        opt.textContent = ex;
        els.expirySelect.appendChild(opt);
      });
      if (dateEntry.expiries.indexOf(keepExpiry) !== -1) els.expirySelect.value = keepExpiry;
      onExpiryChange();
    } else {
      els.expiryField.style.display = "none";
      renderTable(dateEntry || null);
      renderInterpolation(currentCurveMeta(), dateEntry || null);
    }
  }

  function onCurveChange() {
    if (isPit()) { renderPit(); return; }
    els.dateField.style.display = "block";
    els.title.textContent = els.curveSelect.value;
    renderFreshness(currentCurveMeta());
    var byDate = currentCurveDates();
    var dates = Object.keys(byDate).sort().reverse();
    var keepDate = els.dateSelect.value;
    els.dateSelect.innerHTML = "";
    if (dates.length === 0) {
      els.expiryField.style.display = "none";
      renderTable(null);
      renderInterpolation(currentCurveMeta(), null);
      return;
    }
    dates.forEach(function (d) {
      var opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      els.dateSelect.appendChild(opt);
    });
    if (dates.indexOf(keepDate) !== -1) els.dateSelect.value = keepDate;
    onDateChange();
  }

  els.curveSelect.addEventListener("change", onCurveChange);
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { if (data && isPit()) renderPit(); }, 150);
  });
  els.dateSelect.addEventListener("change", onDateChange);
  els.expirySelect.addEventListener("change", onExpiryChange);

  // ------------------------------------------------------------------
  // Load / refresh
  // ------------------------------------------------------------------

  function render(json) {
    data = json;
    var keepCurve = els.curveSelect.value;
    els.curveSelect.innerHTML = "";
    var curvesGroup = document.createElement("optgroup");
    curvesGroup.label = "Curves";
    data.curve_names.forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      curvesGroup.appendChild(opt);
    });
    els.curveSelect.appendChild(curvesGroup);
    if (data.pit) {
      var calGroup = document.createElement("optgroup");
      calGroup.label = "Calibration";
      var pitOpt = document.createElement("option");
      pitOpt.value = PIT_KEY;
      pitOpt.textContent = PIT_LABEL;
      calGroup.appendChild(pitOpt);
      els.curveSelect.appendChild(calGroup);
    }
    if (data.curve_names.indexOf(keepCurve) !== -1 || (keepCurve === PIT_KEY && data.pit)) {
      els.curveSelect.value = keepCurve;
    }
    onCurveChange();
    els.generatedAt.textContent = "Generated " + data.generated_at;
  }

  function load() {
    return fetch("curves.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function (err) {
        els.tableSlot.innerHTML =
          '<p class="empty">Could not load curves.json: ' + err + "</p>";
      });
  }

  els.refreshBtn.addEventListener("click", function () {
    closeMenu();
    load();
  });

  // ------------------------------------------------------------------
  // Init
  // ------------------------------------------------------------------

  applyTheme(currentTheme());
  els.interpTarget.value = todayUTCString();
  load();
})();
</script>
</body>
</html>
